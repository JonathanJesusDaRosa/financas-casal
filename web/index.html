<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: usa a tela inteira do iPhone (inclusive perto do "notch").
         maximum-scale=1 e user-scalable=no: sem zoom de pinça (vale no Android; no iPhone
         quem bloqueia é o código em main.jsx) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Casa em Conta</title>
    <meta name="description" content="As contas da casa, em dia e sem briga." />

    <!-- Ícones -->
    <link rel="icon" href="/brand/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/brand/casa-em-conta-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon-180x180.png" />

    <!-- Cor da barra do navegador/sistema (índigo da marca) -->
    <meta name="theme-color" content="#3D3A8C" />

    <!-- iPhone: abrir em tela cheia quando adicionado à Tela de Início -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Casa em Conta" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
